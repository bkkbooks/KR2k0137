body:
  text: 大唐西域記卷三唐釋玄奘譯釋辨機撰八國烏仗那國鉢露羅國呾義始羅國僧訶補羅國烏剌尸國迦濕彌羅國半笯奴故反蹉國曷羅闍補羅國烏仗那國周五千餘里山谷相屬川澤連原榖稼雖播地利不滋多蒲萄少甘蔗土産金鐵宜鬱金香林樹蓊鬱花果茂盛寒暑和暢風雨順序人性怯懦俗情譎詭好學而不功禁呪為藝業多衣白㲲少有餘服語言雖異大同印度文字禮儀頗相參預崇重佛法敬信大乘來蘇婆伐窣堵河舊有一千四百伽藍多已荒蕪昔僧徒一萬八千今漸減少並學大乘寂定為業善誦其文未究深義戒行清潔特間禁呪律儀傳訓有五部焉一法密部二化地部三飲光部四説一切有部五大衆部天祠十有餘所異道雜居堅城四五其王多治瞢揭釐城城周十六七里居人殷盛瞢揭釐城東四五里大窣堵波極多靈瑞是佛在昔作忍辱仙於此為羯利王唐言鬪諍舊云哥利訛也割截肢體瞢揭釐城東北行二百五六十里入大山至阿波邏羅龍泉即蘇婆伐窣堵河之源也𣲖流西南春夏含凍昏夕飛雪雪霏五彩光流四照此龍者迦葉波佛時生在人趣名曰殑祗深間呪術禁御惡龍不令暴雨國人賴之以蓄餘糧居人衆庶感恩懷德家稅斗榖以饋遺焉既積嵗時或有逋課殑祗含怒願為毒龍暴行風雨損傷苖稼命終之後為此池龍泉流白水損傷地利釋迦如來大悲御世愍此國人獨遭斯難降神至此欲化暴龍執金剛神杵擊山崖龍王震懼乃出池皈依聞佛説法心淨信悟如來遂制勿損農稼龍曰凡有所食賴收人田今蒙聖教恐難濟急願十二歲一收糧儲如來含覆愍而許焉故今十二年一遭白水之災阿波邏羅龍泉西南三十餘里水北岸大磐石上有如來足所履迹隨人福力量有短長是如來伏此龍已留迹而去後人於上積石為室遐邇相趨花香供養順流而下三十餘里至如來濯衣石袈裟之文懦焉如縷瞢揭釐城南四百餘里至醯羅山谷水西𣲖逆流東上雜花異果被澗緣崖峯巖危險溪谷盤紆或聞喧語之聲或聞音樂之響方石如榻宛若工成連延相屬接布崖谷是如來在昔為聞半頌舊曰偈梵文略也或曰偈陀梵音訛也今從正旨宜云伽陀者唐言頌頌三十二言之法於此捨身命焉瞢揭釐城南二百餘里大山側至摩訶伐那唐言大林伽藍是如來昔修菩薩行號薩縳逹之王唐言一切施避敵棄國潛行至此遇貧婆羅門方來乞丐既失國位無以為施遂令羈縛擒往敵王冀以賞財回為惠施摩訶伐那伽藍西北下山三四十里至摩愈唐言豆伽藍有窣堵波髙百餘尺其側大方石上有如來足蹈之迹是佛昔蹈此石放拘胝光明照摩訶伐那伽藍為諸人天説本生事其窣堵波基下有石色帶黃白常有津膩是如來在昔修菩薩行為聞正法於此析骨書寫經典摩愈伽藍西六七十里至窣堵波無憂王之所建也是如來昔修菩薩行號尸毗迦王唐言與舊曰尸毗王略也為求佛果於此割身從鷹代鴿代鴿西北二百餘里入珊尼羅闍川至薩裒殺地唐言蛇藥僧伽藍有窣堵波高八十餘尺是如來昔為帝釋時遭飢嵗疾疫流行醫療無功道殣相屬帝釋悲愍思所救濟乃變其形為大蟒身僵尸川谷空中遍告聞者感慶相率奔赴隨割隨生療飢療疾其側不逺有蘇摩大窣堵波是如來昔為帝釋時世疾疫愍諸含識自變其身為蘇摩蛇凡有噉食莫不康豫珊尼羅闍川北石崖邉有窣堵波病者至求多蒙除瘥如來在昔為孔雀王與其羣而至此熱渴所逼求水不獲孔雀王以㭰啄崖涌泉流注今遂為池飲沐愈疾石上猶有孔雀趾迹瞢揭釐城西南行六七十里大河東有窣渚波高六十餘尺上軍王之所建也昔如來之將寂滅告諸大衆我涅槃後烏仗那國上軍王宜與舍利之分及諸王將欲均量上軍王後來遂有輕鄙之議是時天人大衆重宣如來顧命之言乃預同分持歸本國式遵崇建窣堵波側大河濵有大石狀如象昔上軍王以大白象負舍利歸至於此地象忽蹎仆因而自斃遂變為石即於其側起窣渚波瞢揭釐城西五十餘里渡大河至盧醯呾迦唐言赤窣渚波高五十餘尺無憂王之所建也昔如來修菩薩行為大國王號曰慈力於此刺身血以飼五藥義舊曰夜義訛也瞢揭釐城東北三十餘里至遏部多唐言竒特石窣堵波高四十餘尺在昔如來為諸人天説法開導如來去後從地踊出黎庶崇敬香花不替石窣堵波西渡大河三四十里至一精舍中有阿縳盧枳低濕伐羅菩薩像唐言觀自在合字連聲梵語如上分文散音即阿嚩盧枳多譯曰觀伊濕伐羅譯曰自在舊譯為光世音或觀世音或觀世自在皆訛謬也威靈潛被神迹照明法侶相趨供養無替觀自在菩薩像西北百四五十里至藍勃盧山山嶺有龍池周三十餘里渌波浩汗清流皎鏡昔毗盧釋迦王前伐諸釋四人拒軍者宗親擯逐各事分飛其一釋種既出國都跋涉疲弊中路而止時有一鴈飛趣其前既以馴狎因即乘焉其鴈飛翔下此池側釋種虗遊逺適異國迷不知路假寐樹隂池龍少女遊覽水濵忽見釋種恐不得當也變為人形即而摩拊釋種驚寤因即謝曰羇旅羸人何見親附遂欵殷勤陵逼野合女曰父母有訓祗奉無違雖蒙惠顧未承高命釋種曰山谷杳冥爾家安在曰我此池之龍女也敬聞聖族流離逃難幸因遊覽敢慰勞弊命有燕私未聞來旨况乎積禍受此龍身人畜殊途非所聞也釋種曰一言見允宿心斯畢龍女曰敬聞命矣唯所去就釋種乃誓心曰凡我所有福德之力令此龍女舉體成人福力所感龍遂改形既得人身深自慶悅乃謝釋種曰我積殃運流轉惡趣幸蒙垂顧福力所加曠劫弊身一旦改變欲報此德糜軀未謝心願陪遊事拘物議願白父母然後備禮龍女還池白父母曰今者遊覽忽逄釋種福力所感變我為人情存好合敢陳事實龍王心欣人趣情重聖族遂從女請乃出池而謝釋種曰不遺非類降尊就卑願臨我室敢供灑掃釋種受龍王之請遂即其居於是龍宫之中親迎備禮燕爾樂會肆極歡娛釋種覩龍之形心常畏惡乃欲辭出龍王止曰幸勿逺舍鄰此宅居當令據壃土稱大號揔有臣庶祚延長世釋種謝曰此言非冀龍王以寶劍置篋中妙好白㲲而覆其上謂釋種曰幸持此㲲以獻國王王必親受逺人之貢可於此時害其王也因據其國不亦善乎釋種受龍指誨便往行獻烏仗那王躬舉其㲲釋種執其袂而刺之侍臣衛兵喧亂階陛釋種麾劍告曰我所仗劍神龍見授以誅後伏以斬不臣咸懼神武推尊大位於是沿弊立政表賢恤患已而動大衆備法駕即龍宫而報命迎龍女以還都龍女宿業未盡餘報猶在每至燕私首出九龍之頭釋種畏惡莫知圖計伺其寐也利刃斷之龍女驚寤曰斯非後嗣之利非徒我命有少損傷而汝子孫當苦頭痛故此國族常有斯患雖不連綿時一發動釋種既沒其子嗣位是為嗢呾羅犀那王唐言上軍上軍王嗣位之後其母喪明如來伏阿波邏羅龍還也從空下其宫中上軍王適從遊獵如來因為其母略説法要遇聖聞法遂得復明如來問曰汝子我之族也今何在母曰旦出畋遊今將返駕如來與諸大衆尋欲發引王母曰我惟福遇生育聖族如來悲愍又親降臨我子方還願少留待世尊曰斯人者我之族也可聞教而信悟非親誨以發心我其行矣還語之曰如來從此往拘尸城娑羅樹間當入涅槃宜取舍利自為供養如來與諸人衆陵虛而去上軍王方遊獵逺見宫中光明赫奕疑有火災罷獵而返乃見其母復明慶而問曰我去幾何有斯祥感能令慈母復明如昔母曰汝出之後如來至此聞佛説法遂得復明如來從此至拘尸城娑羅樹間當入涅槃召汝速來分取舍利時王聞已悲號頓躃久而醒悟命駕馳赴至雙樹間佛已涅槃時諸國王輕其邉鄙寶重舍利不欲分與是時天人大衆重宣佛意諸王聞已遂先均授瞢揭釐城東北踰山越谷逆上信度河途路危險山谷杳冥或履絙索或牽鐵鎖棧道虛臨飛梁危搆㧻棧躡磴行千餘里至逹麗羅川即烏仗那國舊都也多出黃金及鬱金香逹麗羅川中大伽藍側有刻木慈氏菩薩像金色晃煜靈鑒潛通髙百餘尺末田底迦舊曰末田地訛略也阿羅漢之所造也羅漢以神通力㩗引匠人升覩史多天舊曰兜率陀又曰兜術陀訛也親觀妙相三返之後功乃畢焉自有此像法流東𣲖從此東行踰嶺越谷逆上信度河飛梁棧道履危涉險經五百餘里至鉢露羅國北印度境鉢露羅國周四千餘里在大雪山間東西長南北狹多麥豆出金銀資金之利國用冨饒時唯寒烈人性獷暴薄於仁義無聞禮節形貌鹿弊衣服毛褐文字大同印度言語異於諸國伽藍數百所僧徒數千人學無專習戒行多濫從此復還烏鐸迦漢茶城南渡信度河河廣三四里西南流澄清皎鏡汩濦漂流毒龍惡獸窟冗其中若持貴寶竒花果種及佛舍利渡者船多漂沒渡河至呾義始羅國北印度境呾義始羅國周二千餘里國大都城周十餘里酋豪力競王族絶嗣往者役屬迦畢試國近又附庸迦濕彌羅國地稱沃壤稼穡殷盛泉流多花果茂氣序和暢風俗輕勇崇敬三寶伽藍雖多荒蕪已甚僧徒寡少並學大乘大城西北七十餘里有醫羅鉢呾邏龍王池周百餘步其水澄清雜色蓮花同榮異彩此龍者即昔迦葉波佛時壞醫羅鉢呾邏樹苾芻也故今彼土請雨祈晴必與沙門共至池所彈指慰問隨願必果龍池東南行三十餘里入兩山間有窣堵波無憂王之所建也髙百餘尺是釋迦如來懸記當來慈氏世尊出興之時自然有四大寶藏即斯勝地當其一所聞諸先志曰或時地震諸山皆動周藏百步無所傾搖諸有愚夫妄加發掘地為震動人皆蹎仆傍有伽藍圯損己甚久絶僧徒城北十二三里有窣堵波無憂王建也或至齋日時放光明神花天樂頗有見聞聞諸先志曰近有婦人身嬰惡癩竊至窣堵波責躬禮懴見其庭宇有諸糞穢掬除灑掃塗香散花更採青蓮重布其地惡疾除愈形貌增妍身出名香青蓮同馥斯勝地也是如來在昔修菩薩行為大國王號戰達羅鉢刺婆唐言月光志求菩薩斷頭惠施若此之捨凡歷千生捨頭窣堵波側有僧伽藍庭宇荒涼僧徒減少昔經部拘摩羅邏多唐言童受論師於此製述諸論城外東南南山之隂有窣堵波髙百餘尺是無憂王太子拘浪拏為繼母所誣抉目之處無憂王所建也盲人祈請多有復明此太子正后生也儀貌妍雅慈仁夙著正后終沒繼室憍淫縱其昏愚私逼太子太子瀝泣引責退身謝罪繼母見違彌增忿怒候王間隙從容言曰夫呾義始羅國之要領非親子弟其可寄乎今者太子仁孝著聞親賢之故物議斯在王惑聞説雅恱姦謀即命太子而誡之曰吾承餘緒垂統繼業唯恐失墜忝負先王呾義始羅國之襟帶吾今命爾作鎮彼國國事殷重人情詭雜無妄去就有虧基緒凡有召命驗吾齒印印在吾口其有謬乎於是太子銜命來鎮嵗月雖淹繼室彌怒詐發制書紫泥封記候王眠睡竊齒為印馳使而往賜以責書輔臣跪讀相顧失圖太子問曰何所悲乎曰大王有命書責太子抉去兩目逐棄山谷任其夫妻隨時生死雖有此命尚未可依今宜重請面縳待罪太子曰父而賜死其敢辭乎齒印為封誠無謬矣命旃荼羅抉去其眼眼既失明乞丏自濟流離展轉至父都城其妻告曰此是王城嗟乎飢寒良苦昔為王子今作乞人願得聞知重伸先責於是謀計入王內廄於夜後分泣對清風長嘯悲吟箜篌鼓和王在髙樓聞其雅唱辭甚怨悲怪而問曰箜篌歌聲似是吾子今以何故而來此乎即問內廄誰為歌嘯遂將盲人而來對旨王見太子銜悲問曰誰害汝身遭此禍舋愛子喪明猶不覺知凡百黎元如何究察天乎天乎何德之衰太子悲泣謝而對曰誠以不孝負責於天某年月日忽奉慈旨無由致辭不敢逃責其王心知繼室為不軌也無所究察便加刑辟時菩提樹伽藍有瞿沙唐言妙音大阿羅漢者四辨無礙三明具足王將盲子陳告其事唯願慈悲令得復明時彼羅漢受王請已即於是日宣令國人吾於後日欲説妙理人持一器來此聽法以承泣淚也於是逺近相趨士女雲集是時阿羅漢説十二因緣凡厥聞法莫不悲哽以所持器承其瀝泣説法既已揔收衆淚置之金盤而自誓曰凡吾所説諸佛至理理若不真説有紕繆斯則已矣如其不爾願以衆淚洗彼盲眼眼得復明明視如昔發是語訖持淚洗眼眼遂復明王乃責彼輔臣詰諸僚佐或黜或放或遷或死諸豪世俗移居雪山東北沙磧之中從此東南越諸山谷行七百餘里至僧訶補羅國北印度境僧訶補羅國周三千五六百里西臨信度河國大都城周十四五里依山據嶺堅峻險固農務少功地利多獲氣序寒人性猛俗尚驍勇又多譎詐國無君長主位役屬迦濕彌羅國城南不逺有窣堵波無憂王之所建也莊飾有虧靈異相繼傍有伽藍空無僧侣城東南四五十里至石窣堵波無憂王建也高二百餘尺池沼十數映帶左右雕石為岸殊形異類激水清流汩潝漂注龍魚水族窟冗潛流四色蓮花彌漫清潭百果具繁同榮異色林沼交映誠可遊玩傍有伽藍久絶僧侣窣堵波側不逺有白衣外道本師悟所求理初説法處今有封記傍建天祠其徒苦行晝夜精勤不遑寧息本師所説之法多竊佛經之義隨類設法擬則軌儀大者謂苾芻小者稱沙彌威儀律行頗同僧法唯留少髮加之露形或有所服白色為異據斯流别稍用區分其天師像竊類如來衣服為差相好無異從此復還呾義始羅國北界渡信度河東南行二百餘里度大石門昔摩訶薩埵王子於此投身飼餓烏菟音徒其南百四五十步有石窣堵波摩訶薩埵愍餓獸之無力也行至此地乾竹自刺以血噉之於是乎獸乃噉焉其中地土洎諸草木微帶絳色猶血染也人履其地若負芒刺無云疑信莫不悲愴捨身北有石窣堵波髙二百餘尺無憂王之所建也雕刻竒製時燭神光小窣堵波及諸石龕動以百數周此塋域其有疾病旋繞多愈石窣堵波東有伽藍僧徒百餘人並學大乘教從此東行五十餘里至孤山中有伽藍僧徒二百餘人並學大乘法教花果繁茂泉池澄鏡傍有窣堵波髙三百餘尺是如來在昔於此化惡藥義令不食肉從此東南山行五百餘里至烏剌尸國北印度境烏剌尸國周二千餘里山阜連接田疇隘狹國大都城周七八里無大君長役屬迦濕彌羅國宜稼穡少花果氣序溫和微有霜雪俗無禮義人性剛猛多行詭詐不信佛法大城西南四五里有窣堵波髙二百餘尺無憂王所建也傍有伽藍僧徒寡少並皆習學大乘法教從此東南登山履險度鐵橋行千餘里至迦濕彌羅國舊曰罽賔訛也北印度境迦濕彌羅國周七千餘里四境負山山極峭峻雖有門徑而復隘狹自古鄰敵無能攻伐國大都城西臨大河南北十二三里東西四五里宜稼穡多花果出龍種馬及鬱金香火珠藥草氣序寒徑多雪少風服毛褐衣白㲲土俗輕僄人性怯懦國為龍護遂雄鄰境容貌妍美情性詭詐好學多聞邪正兼信伽藍百餘所僧徒五千餘人有四窣堵波並無憂王建也各有如來舍利升餘國志曰國地本龍池也昔佛世尊自烏仗那國降惡神已欲還中國乘空當此國上告阿難曰我涅槃之後有末田底迦阿羅漢當於此地建國安人𢎞揚佛法如來寂滅之後第五十年阿難弟子末田底迦羅漢者得六神通具八解脫聞佛懸記心自慶恱便來至此於大山嶺宴坐林中現大神變龍見深信請資所欲阿羅漢曰願於池內惠以容膝龍王於是縮水奉施羅漢神通廣身龍王縱力縮水池空水盡龍翻請地阿羅漢於此西北為留一池周百餘里自餘枝屬别居小池龍王曰池地揔施願恆受供末田底迦曰我今不久無餘涅槃雖欲受請其可得乎龍王重請五百羅漢常受我供乃至法盡法盡之後還取此國以為居地末田底迦從其所請時阿羅漢既得其地運大神通力立五百伽藍於諸異國買鬻賤人以充役使以供僧衆末由底迦入寂滅後彼諸賤人自立君長鄰境諸國鄙其賤種莫與交親謂之訖利多唐言買得今時泉水已多流濫摩揭陀國無憂王以如來涅槃之後第一百年命世君臨威被殊俗深信三寶愛育四生時有五百羅漢僧五百凡夫僧王所敬仰供養無差有凡夫僧摩訶提婆唐言大天濶逹多智幽求名實覃思作論理違聖教凡有聞知羣從異議無憂王不識凡聖因情所好黨援所親召集僧徒赴殑伽河欲沉深流揔從誅戮時諸羅漢既逼命難咸運神通陵虛履空來至此國山棲谷隱時無憂王聞而悔懼躬來謝過請還本國彼諸羅漢確不從命無憂王為羅漢建五百僧伽藍揔以此國持施衆僧健馱邏國迦膩色迦王以如來涅槃之後第四百年應期撫運王風逺被殊俗內附機務餘暇每習佛經日請一僧入宫説法而諸異議部執不同王用深疑無以去惑時脅尊者曰如來去世嵗月逾邈弟子部執師資異論各據聞見共為矛盾時王聞已甚用感傷悲嘆良久謂尊者曰猥以餘福聿遵前緒去聖雖逺猶為有幸敢忘庸鄙紹隆法教隨其部執具釋三藏脅尊者曰大王宿殖善本多資福祐留情佛法是所願也王乃宣令逺近召集聖哲於是四方輻湊萬里星馳英賢畢萃睿聖咸集七日之中四事供養既欲法議恐其喧雜王乃具懷白諸僧曰證聖果者住具結縛者還如此尚衆又重宣令無學人住有學人還猶復繁多又更下令具三明備六通者住自餘各還然尚繁多又更下令其有內窮三藏外達五明者住自餘各還於是得四百九十九人王欲於本國苦其暑濕又欲就王舍城大迦葉波結集石室脅尊者等議曰不可彼多外道異論糾紛酬對不暇何功作論衆會之心屬意此國此國四周山固藥義守衛土地膏腴物産豐盛賢聖之所集住靈仙之所遊止衆議斯在僉曰允諧其王是時與諸羅漢自彼而至建立伽藍結集三藏欲作毗婆沙論是時尊者世友户外納衣諸阿羅漢謂世友曰結使未除諍議乖謬爾宜逺迹勿居此也世友曰諸賢於法無疑代佛施化方集大義欲製正論我雖不敏粗達微言三藏玄文五明至理頗亦沉研得其趣矣諸羅漢曰言不可以若是汝宜居疾證無學已而會此時未晚也世友曰我顧無學其猶洟唾志求佛果不趨小徑擲此縷丸未墜於地必當證得無學聖果時諸羅漢重訶之曰增上慢人斯之謂也無學果者諸佛所讃宜可速證以決衆疑於是世友即擲縷丸空中諸天接縷丸而請曰方證小果次補慈氏三界特尊四生攸賴如何於此欲證小果時諸羅漢見是事已謝咎推德請為上座凡有疑議咸取決焉是五百賢聖先造十萬頌塢波第鑠論舊曰優波提舍論訛也釋素呾纜藏舊曰修多羅藏訛也次造十萬頌毗奈耶毗婆沙論釋毗奈耶藏舊曰毗那耶藏訛也後造十萬頌阿毗達磨毗婆沙論釋阿毗達磨藏或曰阿毗曇藏略也凡三十万頌六百六十万言備釋三藏懸諸千古莫不窮其枝葉究其淺深大義重明微言再顯廣宣流布後進賴焉迦膩色迦王遂以赤銅為鍱鏤寫論文石函緘封建窣堵波藏於其中命藥義神周衛其國不令異學持此論出欲求習學就中受業於是功既成畢還軍本都出此國西門之外東西面而跪復以此國揔施僧徒迦膩色迦王既死之後訖利多種復自稱王斥逐僧徒毁壞佛法覩貨邏國呬摩呾羅王唐言雪山下其先釋種也以如來涅槃之後第六百年光有壃土嗣膺王業樹心佛地流情法海聞訖利多毁滅佛法招集國中敢勇之士得三千人詐為啇旅多賫寶貨挾隱軍器來入此國此國之君特加賔禮商旅之中又更選募得五百人猛烈多謀各抽利刃俱持重寶躬賫所奉持以獻上時雪山下王去其帽即其座訖利多王驚懾無措遂斬其首令羣下曰我是覩貨邏國雪山下王也怒此賤種公行虐政故於今者誅其有罪凡百衆庶非爾之辜然典國輔宰臣遷於異域既平此國召集僧徒式建伽藍安堵如故復於此國西門之外東面而跪持施衆僧其訖利多種屢以僧徒覆宗滅祀世積其怨疾惡佛法嵗月既逺復自稱王故今此國不甚崇信外道天祠特留意焉新城東南十餘里故城北大山陽有僧伽藍增徒三百餘人其窣堵波中有佛牙長可寸半其色黃白或至齋日時放光明昔訖利多種之滅佛法也僧徒解散各隨利居有一沙門遊諸印度觀禮聖迹伸其至誠後聞本國平定即事歸途遇諸羣象橫行草澤奔馳震吼沙門見已升樹以避是時羣象相趍奔赴競吸池水浸漬樹根互共排掘樹遂蹎仆既得沙門負載而行至大林中有病象瘡痛而卧引此僧手至所苦處乃枯竹所刺也沙門於是拔竹傅藥裂其裳褁其足别有大象持金函授與病象象既得已轉授沙門沙門開函乃佛牙也諸象圍繞僧出無由明日齋時各持異果以為中饌食已載僧去林數百里外方乃下之各跪拜而去沙門至國西界渡一駛河濟乎中流船將覆沒同舟之人互相謂曰今此船覆禍是沙門沙門必有如來舍利諸龍利之船主撿驗果得佛牙時沙門舉佛牙俯謂龍曰吾今寄汝不久來取遂不渡河回船而去顧河嘆曰吾無禁術龍畜所欺重往印度學禁龍法三嵗之後復還本國至河之濵方設壇場其龍於是捧佛牙函以授沙門沙門持歸於此伽藍而修供養伽藍南十四五里有小伽藍中有觀自在菩薩立像其有斷食誓死為期願見菩薩者即從像中出妙色身小伽藍東南三十餘里至大山有故伽藍形製宏壯蕪漫良甚今唯一隅起小重閣僧徒三十餘人並學大乘法教昔僧伽跋陀羅唐言衆賢論師於此製順正理論伽藍左右諸窣堵波大阿羅漢舍利並在野獸山猿採花供養嵗時無替如承指命然此山中多諸靈迹或石壁橫分峯留馬迹凡厥此類其狀譎詭皆是羅漢沙彌羣從遊戲手指麾畫乘馬往來遺迹若斯難以詳述佛牙伽藍東十餘里北山崖間有小伽藍是昔索建地羅大論師於此作衆事分毗婆沙論小伽藍中有石窣堵波高五十餘尺是阿羅漢遺身舍利也先有羅漢形量偉大凡所飲食與象同等時人譏曰徒知飽食安識是非羅漢將入寂滅也告諸人曰吾今不久當取無餘欲説自身所證妙法衆人聞之更相譏笑咸來集會共觀得失時阿羅漢告諸人曰吾今為汝説本因緣此身之前報受象身在東印度居王內廏是時此國有一沙門逺遊印度尋訪聖教諸經典論時王持我施與沙門載負佛經而至於此是後不久尋即命終乘其載經福力所致遂得為人復鍾餘慶早服染衣勤求出離不遑寧居得六神通斷三界欲然其所食餘習尚然每自節身三分食一雖有此説人猶未信即升虛空入火光定身出煙熖而入寂滅餘骸墜下起窣堵波王城西北行二百餘里至商林伽藍布剌拏唐言圓滿論師於此作釋毗婆沙論城西行百四五十里大河北接山南至大衆部伽藍僧徒百餘人昔佛地羅唐言覺取論師於此作大衆部集真論從此西南踰山涉險行七百餘里至半笯奴故反蹉國北印度境半笯蹉國周二千餘里山川多疇壠狹榖稼時播花果繁茂多甘蔗無蒲萄菴沒羅果烏談跋羅茂遮等果家植成林珍其味也氣序溫暑風俗勇烈裳服所製多衣㲲布人性質直淳信三寶伽藍五所並多荒圯無大君長役屬迦濕彌羅國城北伽藍少有僧徒伽藍北有石窣堵波實多靈異從此東南行四百餘里至曷邏闍補羅國北印度境曷邏闍補羅國周四千餘里國大都城周十餘里極險固多山阜川原隘狹地利不豐土宜氣序同半笯蹉國風俗猛烈人性驍勇國無君長役屬迦濕彌羅國伽藍十所僧徒寡少天祠一所外道甚多自濫波國至於此土形貌粗弊情性獷暴語言庸鄙禮義輕薄非印度之正境乃邉裔之曲俗從此東南下山渡水行七百餘里至磔迦國北印度境音釋笯蹉上奴故反下七何反怯愞上苦帖反下奴卧反譎詭上音決下過委反詐也多衣下去聲瞢揭釐上音夢中居謁反下力之反稸許六反稸積也饋遺上求位反下去聲饋遺餉贈也糧儲二字音良除摩愈下音如褒殺上博毛反道殣下渠鎮反死也僵尸上音薑死不壞也㭰啄上子委反下音卓蹎仆上音顛下蒲北反蹎仆伏倒也斃毗祭反死也飼音寺餧飼也盧枳下居只反馴狎上音旬馴順也下胡甲反狎近也袂音寐衣袖也麾劍上許為反嗢呾上烏沒反下丁割反犀音西頓躃下毗益反頓躃跳躍而倒也絙索上古登反大索也棧道上助諌反以板木架險為道也躡隥上尼輒反晃煜上胡廣反下余六反晃煜明也汩潝上於密反下於立反同前水流急貌酋豪上自由反掬音掬捧也抉目上紆決反捾也間隙下邱逆反控隙也淹一鹽反淹久也乞丏下俱代反借也內廏下音救養象馬之舍鼓和下去聲禍舋下許近反罪也紕繆上匹夷反下眉幼反噉之上音淡食噉也洎其器反及也芒刺上音亡下音次悲愴下楚壯反隘狹上於賣反窄也下侯夾反寒徑下居政反輕僄下匹妙反迅也確口角反堅確也矛盾上莫浮反下時尹反兵器名今之是非曰矛盾也輻湊上音福下七奏反亦作輳輻湊併聚也如車輻同湊於轂也糾紛上俱有反糾紛亂也膏腴下音俞膏腴肥也洟唾上音替塢一古反鑠詩若反鍱音葉銅薄也斥逐上音尺棄不用也呬摩上香器反安堵下音覩安堵遷不移也解散上去聲浸漬下在四反傅藥上音付塗傅也駛河上使史二音駛河疾流也偉大上羽鬼反異也磔迦上竹陌反驚懾下之葉反指麾下許為反大唐西域記卷三
