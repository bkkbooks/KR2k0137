淳信之心特甚鄰國上自三寶下至百神莫不輸誠竭心宗敬商估往來者天神現徴祥示祟變求福德伽藍數十所僧徒數千人宗學小乘説出世部王城東北山阿有立佛石像髙百四五十尺金色晃耀寶飾煥爛東有伽藍此國先王之所建也伽藍東有鍮石釋迦佛立像髙百餘尺分身别鑄揔合成立城東十二三里伽藍中有佛入涅槃卧像長千餘尺其王每此設無遮大會上自妻子下至國珍府庫既傾復以身施羣官僚佐就僧酬贖若此者以為所務矣卧像伽藍東南行二百餘里度大雪山東至小川澤泉池澄鏡林樹青蔥有僧伽藍中有佛齒及劫初時獨覺齒長五寸餘廣減四寸復有金輪王齒長三寸廣二寸商諾迦縳娑舊曰商那和修訛也大阿羅漢所持鐵鉢量可八九升凡三賢聖遺物並以黃金緘封又有商諾迦縳娑九條僧伽胝衣絳赤色設諾迦草皮之所績成也商諾迦縳娑者阿難弟子也在先身中以設諾迦草衣於解安居日持施衆僧承兹福力於五百身中隂生隂恆服此衣以最後身從胎俱出身既漸長衣亦隨廣及阿難之度出家也其衣變為法服及受具戒更變為九條僧伽胝將證寂滅入邊際定發智願力留此袈裟盡釋迦遺法法盡之後方乃變壞今已少損信有徴矣從此東行入雪山踰越黑嶺至迦畢試國迦畢試國周四千餘里北背雪山三垂黑嶺國大都城周十餘里宜榖麥多果木出善馬鬱金香異方奇貨多聚此國氣序風寒人性暴獷言辭鄙媟婚姻雜亂文字大同覩貨邏國習俗語言風教頗異服用毛㲲衣兼皮褐貨用金錢銀錢及小銅錢規矩模樣異於諸國王剎利種也有智略性勇烈威懾鄰境統十餘國愛育百姓敬崇三寶嵗造丈八尺銀佛像兼設無遮大會周給貧窶惠施鰥寡伽藍百餘所僧徒六千餘人並多習學大乘法教窣堵波僧伽藍崇髙𢎞敞廣博嚴淨天祠數十所異道千餘人或露形或塗灰連絡髑髏以為冠鬘大城東三四里北山下有大伽藍僧徒三百餘人並學小乘法教聞諸先志曰昔健馱邏國迦膩色迦王威被鄰國化洽逺方治兵廣地至蔥嶺東河西蕃維畏威送質迦膩色迦王既得質子特加禮命寒暑改館冬居印度諸國夏還迦畢試國春秋止健馱邏國故質子三時住處各建伽藍今此伽藍即夏居之所建也故諸屋壁圖畫質子容貌服飾頗同東夏其後得還本國心存故居雖阻山川不替供養故今僧衆每至入安居解安居大興法會為諸質子祈福樹善相繼不絶以至於今伽藍佛院東門南大神王像右足下坎地藏寶質子之所藏也故其銘曰伽藍朽壞取以修治近有邉王貪婪凶暴聞此伽藍多藏珍寶驅逐僧徒方事發掘神王冠中鸚鵡鳥像乃奮羽驚鳴地為震動王及軍人辟易僵仆久而得起謝咎以歸伽藍北嶺上有數石室質子習定之處也其中多藏雜寶其側有銘藥叉守衛有欲開發取中寶者此藥叉神變現異形或作師子或作蟒蛇猛獸毒蟲殊形震怒以故無人敢得攻發石室西二三里大山嶺上有觀自在菩薩像有人至誠願見者菩薩從其像中出妙色身安慰行者大城東南三十餘里至曷邏怙邏僧伽藍傍有窣堵波髙百餘尺或至齋日時燭光明覆鉢勢上石隙間流出黑香油靜夜中時聞音樂之聲聞諸先志曰昔此國大臣曷邏怙羅之所建也功既成已於夜夢中有人告曰汝所建立窣堵波未有舍利明旦有獻上者宜從王請旦入朝進請曰不量庸昧敢有願求王曰夫何所欲對曰今日有先獻者願垂恩賜王曰然曷邏怙邏佇立宫門瞻望所至俄有一人持舍利瓶大臣問曰欲何獻上曰佛舍利大臣曰吾為爾守宜先白王曷邏怙邏恐王珍貴舍利追悔前恩疾往伽藍登窣堵波至誠所感其石覆鉢自開安置舍利已而疾出尚拘衣襟王使逐之石已掩矣故其隙間流黑香油城南四十餘里至霫蘇立反蔽多伐剌祠城凡地大震山崖崩墜周此城界無所動搖霫蔽多伐剌祠城南三十餘里至阿路猱奴髙反山崖嶺峭峻巖谷杳冥其峯每嵗增髙數百尺與曹矩吒國䅳士句反下同那呬羅山髣佛相望便即崩墜聞諸士俗曰初䅳那天神自逺而至欲止此山山神震恐搖蕩溪谷天神曰不欲相舍故此傾動少垂賔主當盈財寶吾今往曹矩吒國䅳那呬羅山每嵗至我受國王大臣祀獻之時宜相屬望故阿路猱山增髙既已尋即崩墜王城西北二百餘里至大雪山山頂有池請雨祈晴隨求果願聞諸先志曰昔健馱邏國有阿羅漢常受此池龍王供養每至中食以神通力并坐繩牀陵虛而往侍者沙彌密於繩牀之下攀援潛隱而阿羅漢時至便往至龍宫乃見沙彌龍王因請留食龍王以天甘露飯阿羅漢以人間味而饌沙彌阿羅漢飯食已訖便為龍王説諸法要沙彌如常為師滌器器有餘粒駭其香味即起惡願恨師忿龍願諸福力於今悉現斷此龍命我自為王沙彌發是願時龍王已覺頭痛矣羅漢説法誨諭龍王謝咎責躬沙彌懷忿未從誨謝既還伽藍至誠發願福力所致是夜命終為大龍王威猛奮發遂來入池殺龍王居龍宫有其部屬揔其統命以宿願故興暴風雨摧拔樹木欲壞伽藍時迦膩色迦王怪而發問其阿羅漢具以白王王即為龍於雪山下立僧伽藍建窣堵波髙百餘尺龍懷宿忿遂發風雨王以宏濟為心龍乘瞋毒作暴僧伽藍窣堵波六壞七成迦膩色迦王恥功不成欲填龍池毁其居室即興兵衆至雪山下時彼龍王深懷震懼變作老婆羅門叩王象而諫曰大王宿植善本多種勝因得為人王無思不服今日何故與龍交爭夫龍者畜也卑下惡類然有大威不可力競乘雲馭風蹈虛履水非人力所制豈王心所怒哉王今舉國興兵與一龍鬬勝則王無伏逺之威敗則王有非敵之恥為王計者宜可歸兵迦膩色迦王未之從也龍即還池聲震雷動暴風拔木沙石如雨雲霧晦冥軍馬驚駭王乃歸命三寶請求加護曰宿殖多福得為人王威懾強敵統贍部洲今為龍畜所屈誠乃我之薄福也願諸福力於今現前即於兩肩起大煙熖龍退風靜霧卷雲開王令軍衆人擔一石用填龍池龍王還作婆羅門重請王曰我是彼池龍王懼威歸命唯王悲愍赦其前過王以含育覆燾生靈如何於我獨加惡害王若殺我我之與王俱墮惡道王有斷命之罪我懷怨讎之心業報皎然善惡明矣王遂與龍明設要契後更有犯必不相赦龍曰我以惡業受身為龍龍性猛惡不能自持瞋心或起當忘所制王今更立伽藍不敢摧毁每遣一人候望山嶺黑雲若起急擊犍椎我聞其聲惡心當息其王於是更修伽藍建窣堵波候望雲氣於今不絶聞諸先志曰窣堵波中有如來骨肉舍利可一升餘神變之事難以詳述一時中窣堵波內忽有煙起少時間便出猛熖時人謂窣堵波已從火燼瞻仰良久火滅煙消乃見舍利如白珠璠循環表柱宛轉而上升高雲際縈旋而下王城西北大河南岸舊王伽藍內有釋迦菩薩弱齡齓齒長餘一寸其伽藍東南有一伽藍亦名舊王有如來頂骨一片面廣寸餘其色黃白髮孔分明又有如來髮髮色青紺螺旋右縈引長尺餘卷可半寸凡此三事每至六齋王及大臣散花供養頂骨伽藍西南有舊王妃伽藍中有金銅窣堵波髙百餘尺聞諸士俗曰其窣堵波中有佛舍利升餘每月十五日其夜便放圎光燭耀露盤聨輝達曙其光漸斂入窣堵波城西南有比羅娑洛山唐言象堅山神作象形故白象堅也昔如來在世象堅神奉請世尊及千二百大阿羅漢山巔有大盤石如來即之受神供養其後無憂王即盤石上起窣堵波髙百餘尺今人謂之象堅窣堵波也亦云中有如來舍利可一升餘象堅窣堵波北山巖下有一龍泉是如來受神飯已及阿羅漢於中嗽口嚼楊枝因即植根今為茂林後人於此建立伽藍名鞞鐸佉唐言嚼楊枝也自此東行六百餘里山谷接連峯巖峭峻越黑嶺入北印度境至濫波國北印度境音釋屈支上居勿反亦云龜兹笯奴故反赭音者㤄捍上芳廢反下胡旦反窣堵上蘇沒反下音覩字颯秣上蘇雜反下音末弭彌爾反呾丁達反噣竹救反捕喝上音步下呼葛反漱口音瘦鄂衍上吾各反下音演愈漫上色俱反珂咄上苦何反下丁骨反謎莫閉反紇胡沒反泯米忍反凛吕錦反鋭羊嵗反呾剌上丁達反下郎達反環峙下直爾反峙立也寒徑下居政反寒色健也左衽下汝審反衣襟也毳昌嵗反毛毳也穹廬上苦弓反下力居反穹廬氊帳也闢皮益反開也大槩下音蓋略也隙丘逆反戍人上詩注反𠢐面上力之反𠢐剝也糜黍上音眉黍之類粗才古反粗略也匾上卑免反下他兮反牝馬上毗忍反雌馬也𢤱悷上音𢤱下音戾難調伏也馴音旬順也狎也噍類上才笑反又子消反怙釐上音户下力之反瑩紆定反瑩飾也腐音父壞也慘烈上七感反鞞鐸佉上音皮下丘迦反婪郎含反赭衣上音者赤衣也湊七奏反至也褊急上必展反空也繒綵上自陵反帛也偉大上羽鬼反奇也恇怯上音匡下丘業反澆訛上音驕浮薄也詭詐上音鬼誑也呾邏上丁割反下郎賀反掠力向反又音略劫也蓊鬱上於孔反樹之茂盛酋豪上自由反雄勇也崎嶇上􅏀竒反下音區險阻也峭峻上七笑反下思閏反厄音厄波剌下郎達反奄襲下音習長戟下居逆反槍戟殞殁上羽敏反亡也澡罐二字音早貫炫耀二字音縣曜輻輳上音福車輻也下七奏反麨蜜上尺小反乾麥屑也伽胝下音知磽確上苦交反下音崔石地也妖祟下私遂反鄙媟下音薛狎也慢也威懾下之葉反驚懾也貧窶下其主反貧甚也石隙􅏀逆反孔也僵仆上音薑下蒲北反仰倒曰僵伏倒曰仆霫蘇立反猱奴高反䅳那上仕句反下奴個反呬許器反覆燾上音富下音盜蓋也縈旋上紆榮反齓齒上昌謹反嵗換齒也大唐西域記卷一
