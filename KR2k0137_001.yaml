body:
  text: 大唐西域記卷一唐釋玄奘譯釋辨機撰三十四國阿耆尼國屈支國跋祿迦國笯奴故反赤建國赭時國㤄敷廢反捍國窣蘇沒反堵利瑟那國颯秣建國弭秣賀國劫布呾那國屈霜去聲你迦國喝捍國捕喝國伐地國貨利習彌伽國羯霜去聲那國呾蜜國赤鄂衍那國忽露摩國愈色俱反漫國鞠和衍那國鑊沙國珂咄羅國拘謎莫閉反陀國縳伽浪國紇露悉泯健國忽凛國縳喝國鋭秣陀國胡實健國呾刺健國揭職國梵衍那國迦畢試國歷選皇猷遐觀帝録庖羲出震之初軒轅垂衣之始所以司牧黎元所以疆畫分野暨乎唐堯之受天運光格四表虞舜之納地圖德流九土自兹已降空傳書事之册逖聼前修徒聞記言之史豈若時逢有道運屬無為者歟我大唐御極則天乘時握紀一六合而光宅四三皇而照臨玄化滂流祥風遐扇同乾坤之覆載齊風雨之鼓潤與夫東夷入貢西戎即敘創業垂統撥亂反正固以跨越前王囊括先代同文共軌至治神功非載記無以贊大猷非昭宣何以光盛業玄奘輒隨遊至舉其風土雖未考方辨俗信已越五踰三含生之疇咸被凱澤能言之類莫不稱功越自天府暨諸天竺幽荒異俗絶域安邦咸承正朔俱霑聲教贊武功之績諷成口實美文德之盛鬱為稱首詳觀載籍所未嘗聞緬惟圖諜誠無與二不有所敘何記化洽今據聞見於是載述然則索訶世界舊曰娑婆世界又曰娑訶世界皆訛三千大千國土為一佛之化攝也今一日月所照臨四天下者據三千大千世界之中諸佛世尊皆此垂化現生現滅導聖導凡蘇迷盧山唐言妙髙山舊曰須彌又曰須彌婁皆訛略四寶合成在大海中據金輪上日月之所回薄諸天之所遊舍七山七海環峙環列山間海水具八功德七金山外乃鹹海也海中可居者大略有四洲焉東毗提訶洲舊曰弗婆提又曰弗于逮訛南贍部洲舊曰閻浮提洲又曰剡浮洲訛也西瞿陀尼洲舊曰瞿耶尼又曰劬伽尼訛北拘盧洲舊曰鬱單越又曰鳩摟訛金輪王乃化被四天下銀輪王則政隔北拘盧銅輪王除北拘盧及西瞿陀尼鐵輪王則唯贍部洲夫輪王者將即大位隨福所感有大輪寶浮空來應感有金銀銅鐵之異境乃四三二一之差因其先瑞即以為號則贍部洲之中地者阿那婆答多池也唐言無熱惱舊曰阿耨逹池訛在香山之南大雪山之北周八百里矣金銀琉璃頗胝飾其岸焉金沙彌漫清波皎鏡大地菩薩以願力故化為龍王於中潛宅出清泠水給贍部洲是以池東面銀牛口流出殑伽河殑巨升反舊曰恆河又曰恆伽訛也繞池一匝入東南海池南面金象口流出信度河舊曰辛頭河訛繞池一匝入西南海池西面琉璃馬口流出縳芻河舊曰博義河訛繞池一匝入西北海池北面頗胝師子口流出徙多河舊曰私陀河訛繞池一匝入東北海或曰潛流地下出積石山即徙多河之流為中國之河源云時無輪王應運贍部洲地有四主焉南象主則暑濕宜象西寶主乃臨海盈寶北馬主寒徑宜馬東人主和暢多人故象主之國躁烈篤學特間異術服則橫巾右袒首則中髻四垂族類邑居室宇重閣寶主之鄉無禮義重財賄短製左衽斷髮長髭有城郭之居務殖貨之利馬主之俗天資獷暴情忍殺戮毳帳穹廬鳥居逐牧人主之地風俗機慧仁義昭明冠帶右衽車服有序安土重遷務資有類三主之俗東方為上其居室則東闢其户旦日則東向以拜人主之地南面為尊方俗殊風斯其大槩至於君臣上下之禮憲章文軌之儀人主之地無以加也清心釋纍之訓出離生死之教象主之國其理優矣斯皆著之經誥聞諸土俗博觀今古詳考見聞然則佛興西方法流東國通譯音訛方言語謬音訛則義失語謬則理乖故曰必也正名乎貴無乖謬矣夫人有剛柔異性言音不同斯則繫風土之氣亦習俗之致也若其山川物産之異風俗性類之差則人主之地國史詳焉馬主之俗寶主之鄉史誥備載可略言矣至於象主之國前古未詳或書地多暑濕或載俗好仁慈頗存方志莫能詳舉豈道有行藏之致固世有推移之運矣是知候律以歸化飲澤而來賔越重險而欵玉門貢方奇而拜絳闕者蓋難得而言焉由是之故訪道逺遊請益之隙存記風土黑嶺已來莫非蕃俗雖戍人同貫而族類羣分畫界封疆大率土著建城郭務田畜性重財賄俗輕仁義嫁娶無禮尊卑無次婦言是用男位居下死則焚骸喪期無數𠢐面截耳斷髮裂裳屠殺羣畜祀祭幽魂吉乃素服凶則皂衣同風類俗略舉條貫異政殊制隨地别敘印度風俗語在後記出髙昌故地自近者始曰阿耆尼國舊曰烏耆阿耆尼國東西六百餘里南北四百餘里國大都城周六七里四面據山道險易守泉流交帶引水為田土宜糜黍宿麥香棗蒲萄梨奈諸果氣序和暢風俗質直文字取則印度微有增損服飾氈毼斷髮無巾貨用金錢銀錢小銅錢王其國人也勇而寡略好自稱伐國無綱紀法不整肅伽藍十餘所僧徒二千餘人習學小乘教説一切有部經教律儀既遵印度諸習學者即其文而玩之戒行律儀潔清勤勵然食雜三淨滯於漸教矣從此西南行二百餘里踰一小山越二大河西得平川行七百餘里至屈居勿反支國舊曰龜兹屈支國東西千餘里南北六百餘里國大都城周十七八里宜糜麥有粳稻出蒲萄石榴多梨奈桃杏土産黃金銅鐵鉛錫氣序和風俗質文字取則印度粗有改變管絃伎樂特善諸國服飾錦毼斷髮巾帽貨用金銀錢小銅錢王屈支種也智謀寡昧迫於強臣其俗生子以木押頭欲其匾也伽藍百餘所僧徒五千餘人習學小乘教説一切有部經教律儀取則印度其習讀者即本文矣尚拘漸教食雜三淨潔清耽玩人以功競國東境城北天祠前有大龍池諸龍易形交合牝馬遂生龍駒𢤱悷難馭龍駒之子方乃馴駕所以此國多出善馬聞諸先志曰近代有王號曰金花政教明察感龍馭乘王欲終沒鞭觸其耳因即潛隱以至于今城中無井取汲池水龍變為人與諸婦會生子驍勇走及奔馬如是漸染人皆龍種恃力作威不恭王命王乃引搆突厥殺此城人少長俱戮略無噍類城今荒蕪人煙斷絶荒城北四十餘里接山阿隔一河水有二伽藍同名昭怙釐而東西隨稱佛像莊飾殆越人工僧徒清肅誠為勤勵東昭怙釐佛堂中有玉石面廣二尺餘色帶黃白狀如海蛤其上有佛足履之迹長尺有八寸廣餘八寸矣或有齋日照燭光明大城西門外路左右各有立佛像髙九十餘尺於此像前建五年一大會處每嵗秋分數十日間舉國僧徒皆來會集上自君王下至士庶損廢俗務奉持齋戒受經聽法竭日忘疲諸僧伽藍莊嚴佛像瑩以珍寶飾之錦綺載諸輦輿謂之行像動以千數雲集會所常以月十五日晦日國王大臣謀議國事訪及髙僧然後宣布會場西北渡河至阿奢理二伽藍唐言奇特庭宇顯敞佛像工飾僧徒肅穆精勤匪怠並是耆艾宿德博學高才逺方俊彥慕義至止國王大臣士庶豪右四事供養久而彌敬聞諸先志曰昔此國先王崇敬三寶將欲遊方觀禮聖迹乃命母弟攝知留事其弟受命竊自割勢防未萌也封之金函持以上王王曰斯何謂也對曰回駕之日乃可開發即付執事隨軍掌護王之還也果有搆禍者曰王令監國淫亂中宫王聞震怒欲置嚴刑弟曰不敢逃責願開金函王遂發而視之乃斷勢也曰斯何異物欲何發明對曰王昔遊方命知留事懼有讒禍割勢自明今果有徴願垂照覽王深敬異情愛彌隆出入後庭無所禁礙王弟於後行遇一夫權五百牛欲事刑腐見而惟念引類增懷我今形虧豈非宿業即以財寶贖此羣牛以慈善力男形漸具以形具故遂不入宫王怪而問之乃陳其始末王以為奇特也遂建伽藍式旌美迹傳芳後葉從此西行六百餘里經小沙磧至跋祿迦國舊謂始墨又曰函墨跋祿迦國東西六百餘里南北三百餘里國大都城周五六里土宜氣序人性風俗文字法則同屈支國語言少異細氈細毼鄰國所重伽藍數十所僧徒千餘人習學小乘教説一切有部國西北行三百餘里度石磧至凌山此則蔥嶺北原水多東流矣山谷積雪春夏含凍雖時消泮尋復結冰經途險阻寒風慘烈多暴龍難陵犯行人由此路者不得赭衣持瓠大聲呌微有違犯災禍目覩暴風奮發飛沙雨石遇者喪沒難以全生山行四百餘里至大清池或名熱海又謂鹹海周千餘里東西長南北狹四面負山衆流交湊色帶青黑味兼鹹苦洪濤浩汗驚波汩潝龍魚雜處靈怪間起所以往來行旅禱以祈福水族雖多莫敢漁捕清池西北行五百餘里至素葉水城城周六七里諸國商人雜居也土宜糜麥蒲萄林樹稀踈氣序風寒人衣氈毼素葉已西數十孤城城皆立長雖不相稟命然皆役屬突厥自素葉水城至羯霜那國地名窣利人亦謂焉文字語言即隨稱矣字源簡略本二十餘言轉而相生其流浸廣粗有書記竪讀其文遞相傳授師資無替服氈毼衣皮㲲裳服褊急齊髮露頂或揔剪剃繒綵絡額形容偉大志性恇怯風俗澆訛多行詭詐大抵貪求父子計利財多為貴良賤無差雖富巨萬服食粗弊力田逐利者雜半矣素葉城西行四百餘里至千泉千泉者地方二百餘里南面雪山三垂平陸水土沃潤林樹扶疏暮春之月雜花若綺泉池千所故以名焉突厥可汗每來避暑中有羣鹿多飾鈴鐶馴狎於人不甚驚走可汗愛賞下命羣屬敢加殺害有誅無赦故此羣鹿得終其夀千泉西行百四五十里至呾邏私城城周八九里諸國商人雜居也土宜氣序大同素葉南行十餘里有小孤城三百餘户本中國人也昔為突厥所掠後遂鳩集同國共保此城於中宅居衣服去就遂同突厥言辭儀範猶存本國從此西南行二百餘里至白水城城周六七里土地所産風氣所宜逾勝呾邏私西南行二百餘里至恭御城城周五六里原隰膏腴樹林蓊鬱從此南行四五十里至笯奴故反赤建國笯赤建國周千餘里地沃壤備稼穡草木鬱茂花果繁盛多蒲萄亦所貴也城邑百數各别君長進止往來不相稟命雖則畫野區分揔稱笯赤建國從此西行二百餘里至赭時國唐言石國赭時國周千餘里西臨葉河東西狹南北長土宜氣序同笯赤建國城邑數十各别君長既無揔主役屬突厥從此東南千餘里至㤄敷廢反捍國㤄捍國周四千餘里山周四境土地膏腴稼穡滋盛多花果宜羊馬氣序風寒人性剛勇語異諸國形貌醜弊自數十年無大君長酋豪力競不相賔伏依川據險畫野分都從此西行千餘里至窣堵利瑟那國窣堵利瑟那國周千四五百里東臨葉河葉河出蔥嶺北原西北而流浩汗渾濁汩潝漂急土宜風俗同赭時國自有王附突厥從此西北入大沙磧絶無水草途路彌漫疆境難測望大山尋遺骨以知所指以記經途行五百餘里至颯秣建國唐言康國颯秣建國周千六七百里東西長南北狹國大都城周二十餘里極險固多居人異方寶貨多聚此國土地沃壤稼穡備植林樹蓊鬱花果滋茂多出善馬機巧之伎特工諸國氣序和暢風俗猛烈凡諸蕃國此為其中進止威儀近逺取則其王豪勇鄰國承命兵馬強盛多是赭羯赭羯之人其性勇烈視死如歸戰無前敵從此東南至弭秣賀國唐言米國弭秣賀國周四五百里據川中東西狹南北長土宜風俗同颯秣建國從此北至劫布呾那國唐言曹國劫布呾那國周千四五百里東西長南北狹土宜風俗同颯秣建國從此國西行三百餘里至屈居勿反霜去聲你迦國唐言何國屈霜你迦國周千四五百里東西狹南北長土宜風俗同颯秣建國從此國西二百餘里至喝捍國唐言東安國喝捍國周千餘里土宜風俗同颯秣建國從此國西四百餘里至捕喝國唐言中安國捕喝國周千六七百里東西長南北狹土宜風俗同颯秣建國從此國西四百餘里至伐地國唐言西安國伐地國