body:
  text: 大唐西域記地理類十外紀之屬提要臣等謹案大唐西域記十二卷唐沙門𤣥奘譯僧辯機撰案唐書西域列傳唐貞觀中𤣥奘西遊天竺諸國晁公武讀書志載是書作𤣥奘撰鄭樵藝文畧則作大唐西域記十二卷𤣥奘撰西域記十二卷辯機撰分為兩書明焦竑經籍志亦仍其誤惟陳振孫書録解題作大唐三藏法師𤣥奘譯大總持寺僧辯機撰與今本合考是書後有辯機記賛稱𤣥奘法師以貞觀三年褰裳遵路杖錫遐征薄言旋軔謁帝洛陽肅承明詔載令宣譯辯機為大總持弟子撰斯方志則是書為𤣥奘所譯而辯機撰次成書可無疑矣昔晉法顯作佛國記其文頗畧唐書西域列傳較為詳核此書所序諸國皆唐書所不載則史所録者朝貢之邦此所記者經行之地也辯機記賛句下間有注文或曰唐言某某或曰某印度境疑為原注又有校正譯語云舊作某某訛者及每卷之末附有音釋疑為後人所加第十一卷僧伽羅國條中有明永樂三年太監鄭和見國王阿烈苦奈兒事自今錫蘭山即古之僧伽羅國也至祈福民庶作無量功徳共三百七十字亦注者附記之語呉氏刋本誤連入正文也所列凡一百三十八國中摩掲陀一國釐為八九卷記載獨詳所述多佛典因果之事而舉其地以實之晁公武讀書志稱𤣥裝至天竺求佛書因記其所厯諸國凡風俗之宜衣服之制幅隕之廣隘物産之豐嗇悉舉其梗槩葢未詳檢是書姑據名為説也我皇上開闢天西咸歸版圖欽定西域圖志徵實傳信凡前代傳聞之説一一釐正至於西方譯語亦無不為之辨舛訂訛足以昭示奕禩此書音譯既多乖舛而侈陳靈怪尤屬誕妄無稽然山川道里頗有足備參考者姑録存之以廣異聞焉乾隆四十五年六月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀大唐西域記序若夫玉毫流照甘露灑於十千金鏡揚輝薫風被於有截故知示現三界奥稱天子之尊光宅四表式標域中之大是以慧日淪影像化之跡東歸帝猷宏闡大章之步西極有慈恩道場三藏法師諱𤣥奘俗姓陳氏其先潁川人也帝軒提象控華渚而開源大舜賔門基厯山而聳構三恪照於姬載六竒光於漢祀書奏而承朗月逰道而聚徳星縱壑駢鱗培風齊翼世濟之美鬱為景胄法師藉慶誕生含和降徳結根深而䓲茂導源浚而靈長竒開之歳霞軒月舉聚沙之年蘭薫桂馥洎乎成立藝殫墳素九臯載響五府交辟以夫早悟真假夙照慈慧鏡真筌而延佇顧生涯而永息而朱紱紫纓誠有界之徽網寳車丹枕寔出世之津途由是擯落塵滓言歸閒曠令兄長捷法師釋門之棟幹者也擅龍象於身世挺鶖鷺於當年朝野挹其風猷中外羨其聲彩既而情深友愛道睦天倫法師服勤請益分隂靡棄業光上首擢秀檀林徳契中庸騰芬蘭室抗策平道包九部而吞夢鼓枻𤣥津俯四韋而小魯自兹徧逰談肆載移凉燠功既成矣能亦畢矣至於太初日月燭燿靈臺子雲鞶帨發揮神府於是金文蹔啟佇秋駕而雲趨玉柄纔撝披霧市而波屬若㑹斵輪之㫖猶知拜瑟之㣲以瀉瓶之多聞泛虛舟而獨遠迺於轘轅之地先摧鍱腹之誇井絡之鄉遽表浮杯之異遠邇宗挹為之語曰昔聞荀氏八龍今見陳門雙驥汝潁多竒士誠哉此言法師自幼迄長逰刃𤣥籍名流先達部執交馳趨末忘本摭華捐實遂有南北異學是非紛糺永言於此良用憮然或恐傳譯踳駮未能筌究欲窮香象之文將罄龍宫之目以絶倫之徳屬㑹昌之期杖錫拂衣第如遐境於是背𤣥灞而延望指葱山而矯迹川陸綿長備嘗艱險陋博望之非遠嗤法顯之為局逰踐之處畢究方言鐫永幽賾妙窮津㑹於是詞發雌黄飛英天竺文傳貝葉聿歸震旦太宗文皇帝金輪纂御寳位居尊載佇風徽召見青蒲之上迺睠通識前膝黄屋之間手詔綢繆中使繼路俯摛睿思乃製三藏聖教序凡七百八十言今上昔在春闈裁述聖記凡五百七十九言啟𤣥妙之津書揄揚之㫖蓋非道映雞林譽光鷲嶽豈能緬降神藻以旌時秀奉詔翻譯梵本凡六百五十七部具覽遐方異俗絶壌殊風土著之宜人備之序正朔所暨聲教所覃著大唐西域記勒成一十二卷編録典奥綜覈明審立言不朽其在兹焉
