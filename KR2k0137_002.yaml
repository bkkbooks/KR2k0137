body:
  text: 大唐西域記卷二唐釋𤣥奘譯釋辨機撰三國濫波國那揭羅曷國健䭾羅國詳夫天竺之稱異議糾紛舊云身毒或曰賢豆今從正音宜云印度印度之人隨地稱國殊方異俗遙舉總名語其所美謂之印度印度者唐言月月有多名斯其一稱言諸羣生輪回不息無明長夜莫有司晨其猶白日既隱宵燭斯繼雖有星光之照豈如朗月之明茍緣斯致因而譬月良以其土聖賢繼軌導凡御物如月照臨由是義故謂之印度印度種姓族類羣分而婆羅門特為清貴從其雅稱傳以成俗無云經界之别揔謂婆羅門國焉若其封壃之域可得而言五印度之境周九萬餘里三垂大海北背雪山北廣南狹形如半月畫野區分七十餘國時特暑熱地多泉濕北乃山阜隱軫􅏀陵潟滷東則川野沃潤疇壠膏腴南方草木榮茂西方土地磽確斯大槩也可略言焉夫數量之稱謂踰繕那舊曰由旬又曰踰闍那又曰由延皆訛略也踰繕那者自古聖王一日軍行也舊傳一踰繕那四十里矣印度國俗乃三十里聖教所載唯十六里窮微之數分一踰繕那為八拘盧舍拘盧舍者謂大牛鳴聲所極聞拘盧舍分一拘盧舍為五百弓分一弓為四肘分一肘為二十四指分一指節為七宿麥乃至虱蟣隙塵牛毛羊毛兔毫銅水次第七分以至細塵細塵七分為極細塵極細塵者不可復㭊㭊即歸空故曰極微也若乃隂陽歷運日月次舍稱謂雖殊時候無異隨其星建以標月名時極短者謂剎那也百二十剎那為一呾剎那六十呾剎那為一臘縛三十臘縛為一牟呼栗多五牟呼栗多為一時六時合成一日一夜夜三晝三居俗日夜分為八時晝四夜四於一一時各有四分月盈至滿謂之白分月虧至晦謂之黑分黑分或十四日十五日月有小大故也黑前白後合為一月六月合為一行日遊在內北行也日遊在外南行也揔此二行合為一嵗又分一嵗以為六時正月十六日至三月十五日漸熱也三月十六日至五月十五日盛熱也五月十六日至七月十五日雨時也七月十六日至九月十五日茂時也九月十六日至十一月十五日漸寒也十一月十六日至正月十五日盛寒也如來聖教嵗為三時正月十六日至五月十五日熱時也五月十六日至九月十五日雨時也九月十六日至正月十五日寒時也或為四時春夏秋冬也春三月謂制呾邏月吠舍佉月逝瑟吒月當此從正月十六日至四月十五日夏三月謂頞沙荼月室羅伐拏月婆達羅鉢陀月當此從四月十六日至七月十五日秋三月謂頞濕縛庫闍月迦刺底迦月未伽始羅月當此從七月十六日至十月十五日冬三月謂報沙月磨祛月頗勒窶拏月當此從十月十六日至正月十五日故印度僧徒依佛聖教坐兩安居或前三月或後三月前三月當此從五月十六日至八月十五日後三月當此從六月十六日至九月十五日前代譯經律者或云坐夏或云坐臘斯皆邊裔殊俗不達中國正音或方言未融而傳譯有謬又推如來入胎初生出家成佛涅槃日月皆有參差語在後記若夫邑里閭閻方域廣峙街衢巷陌曲徑槃紆闤闠當塗旗亭夾路屠釣倡優魁膾除糞旌厥宅居斥之邑外行里往來僻於路左至於宅居之制垣郭之作地既卑濕城多疊甎暨諸牆壁或編竹木室宇臺觀板屋平頭埿以石灰覆以甎墼諸異崇構製同中夏苫茅苫草或甎或板壁以石灰為飾地塗牛糞為淨時花散布斯其異也諸僧伽藍頗極竒製隅樓四起重閣三層榱梠棟梁竒形雕鏤戶牖垣墻圖畫衆彩黎庶之居內侈外儉奧室中堂高廣有異層臺重閣形製不拘門闢東戶朝座東面至於坐止咸用繩牀王族大人士庶豪右莊飾有殊規矩無異君王朝座彌復髙廣珠璣間錯謂師子牀敷以細㲲蹈以寶機凡百庶僚隨其所好刻雕異類瑩飾竒珍衣裳服玩無所裁製貴鮮白輕雜彩男則繞腰絡腋橫巾右袒女乃䄡衣下垂通肩揔覆頂為小髻餘髮垂下或有剪髭别為詭俗首冠花鬘身佩瓔珞其所服者謂驕奢耶衣及㲲布等驕奢耶者野蠶絲也芻摩衣麻之類也顩墟嚴反鉢羅衣織細羊毛也褐刺縭衣織野獸毛細耎可得緝績故以見珍而充服用其北印度風土寒烈短製褊衣頗同蕃服外道服飾紛雜異製或衣孔雀羽尾或飾髑髏瓔珞或無服露形或草板掩體或拔髮斷髭或蓬鬢堆髻裳衣無定赤白不恆沙門法服唯有三衣及僧却﨑泥縛些桑箇反那三衣裁製部執不同或緣有寬狹或葉有小大僧却﨑唐言掩腋舊曰僧祗支訛也覆左肩掩兩腋左開右合長裁過腰泥縳些那唐言裙舊曰涅槃僧訛也既無帶襻其將服也集衣為褶束帶以絛褶則諸部各異色乃黃赤不同剎帝利婆羅門清素居簡潔白儉約國王大臣服玩良異花鬘寶冠以為首飾環釧瓔珞而作身佩其有富啇大賈唯釧而已人多徒跣少有所履染其牙齒或赤或黑齊髮穿耳修鼻大眼斯其貌也夫其潔清自守非矯其志凡有饌食必先盥洗殘宿不再食器不傳瓦木之器經用必棄金銀銅鐵每加摩瑩饌食既訖嚼楊枝而為淨澡潄未終無相執觸每有溲溺必事澡濯身塗諸香所謂栴檀鬱金也君王將趨鼓奏絃歌祭祀拜詞沐浴盥洗詳其文字梵天所製原始垂則四十七言遇物合成隨事轉用流演枝𣲖其源浸廣因地隨人微有改變語其大較未異本源而中印度特為詳正辭調和雅與天同音氣韻清亮為人䡄則鄰境異國習謬成訓競欲澆俗莫守淳風至於記言書事各有司存史誥揔稱謂尼羅蔽茶唐言青藏善惡具舉災祥備著而開䝉誘進先遵十二章七嵗之後漸授五明大論一曰聲明釋詁訓字詮目流别二曰巧明伎術機關隂陽歷數三醫方明禁呪間邪藥石針艾四謂因明考定正邪研核真僞五曰內明䆒暢五乘因果妙理其婆羅門學四吠陀論舊曰毗陀訛也一曰壽謂養生繕性二曰祠謂享祭祈禱三曰平謂禮儀占卜兵法軍陳四曰術謂異能伎數禁呪醫方師必博䆒精微貫窮𤣥奧示之大義導以微言提撕善誘雕朽勵薄若乃識量通敏志懷逋逸則拘縶及關業成後已年方三十志立學成既居祿位先酬師德其有博古好雅肥遁居貞沉浮物外逍遙事表寵辱不驚聲聞已逺君王雅尚莫能屈迹然而國重聰睿俗貴髙明褒贊既隆禮命亦重故能强志為學忘疲游藝訪道依仁不逺千里家雖豪富志均羇旅口腹之資巡丐以濟有貴知道無恥匱財娛遊惰業偷食靡衣既無令德又非時習恥辱俱至醜聲載揚如來理教隨類得解去聖悠遠正法醇醨任其見解之心俱獲聞知之悟部執峯峙諍論波騰異學專門殊途同致十有八部各擅鋒鋭大小二乘居止區别有宴默思惟經行住立定慧悠隔喧靜良殊隨其衆居各制科防無云律論經紀凡是佛經講宣一部乃免僧知事二部加上房資具三部差侍者祗承四部給淨人役使五部則行乘象輿六部又導從周衛道德既髙旌命亦異時集講論考其優劣彰别善惡黜陟幽明其有商榷微言抑揚妙理雅辭贍美妙辨敏捷於是馭乘寶象導從如林至乃義門虗闢辭鋒挫鋭理寡而辭繁義乖而言順遂即靣塗赭堊身坌塵土斥於曠野棄之溝壑既旌淑慝亦表賢愚人智樂道家勤志學出家歸俗從其所好罹咎犯律僧中科罰輕則衆命訶責次又衆不與語重乃衆不共住不共住者斥擯不齒出一住處措身無所羇旅艱辛或返初服若夫族姓殊者有四流焉一曰婆羅門淨行也守道居貞潔白其操二曰剎帝利王種也舊曰剎利略也奕世君臨仁恕為志三曰吠奢舊曰毗舍訛也商賈也貿遷有無逐利逺近四曰戍陀羅舊曰首陀訛也農人也肆力疇壠勤身稼穡凡兹四姓清濁殊流婚娶通親飛伏異路內外宗枝姻媾不雜婦人一嫁終無再醮自餘雜姓實繁種族各隨類聚難以詳載君王奕世唯剎帝利篡弒時起異姓稱尊國之戰士驍雄畢選子父傳業遂窮兵術居則宫廬周衛征則奮旅前鋒凡有四兵步馬車象象則被以堅甲牙施利距一將安乘授其節度兩卒左右為之駕馭車乃駕以駟馬兵帥居乘列卒周衛扶輪挾轂馬軍散禦逐北奔命步軍輕捍敢勇充選負大櫓執長㦸或持刀斂前奮行陳凡諸戎器莫不鋒鋭所謂矛盾弓矢刀劍鉞斧戈殳長矟輪索之屬皆世習矣夫其俗也性雖狷急志甚貞質於財無茍得於義有餘讓懼冥運之罪輕生事之業詭譎不行盟誓為信政教尚質風俗猶和凶悖羣小時虧國憲謀危君上事迹彰明則常幽囹圄無所刑戮任其生死不齒人倫犯傷禮義悖逆忠孝則劓鼻截耳斷手刖足或驅出國或放流裔自餘咎犯輸財贖罪理獄占辭不加荆朴隨問欵對據事平科拒違所犯恥過飾非欲䆒情實事須案者凡有四條水火稱毒水則罪人與石盛以連囊沉之深流校其真僞人沉石浮則有犯人浮石沉則無隱火乃燒鐃罪人踞上復使足蹈既遣掌案又令舌䑛虛無所損實有所傷懦弱之人不堪炎熾捧未開花散之向熖虛則花發實則花焦稱則人石平衡輕重取驗虛則人低石舉實則石重人輕毒則以一羖羊剖其右髀隨被訟人所食之分雜諸毒藥置剖髀中實則毒發而死虗則毒歇而蘇舉四條之例防百非之路致敬之式其儀九等一發言慰問二俯首示敬三舉手髙揖四合掌平拱五屈膝六長跪七手膝踞地八五輪俱屈九五體投地凡斯九等極唯一拜跪而讃德謂之盡敬逺則稽顙拜手近則䑛足摩踵凡其致辭受命褰裳長跪尊賢受拜必有慰辭或摩其頂或拊其背善言誨導以示親厚出家沙門既受敬禮唯加善願無止跪拜隨所宗事多有旋繞或唯一周或復三匝宿心别請數則從欲凡遭疾病絶粒七日期限之中多有痊愈必未瘳差方乃餌藥藥之性類名種不同醫之工伎占候有異終沒臨喪哀號相泣裂裳拔髮拍額椎胸服制無聞喪期無數送終殯葬其儀有三一曰火葬積薪焚燎二曰水葬沉流漂散三曰野葬棄林飼獸國王殂落先立嗣君以主喪祭以定上下生立德號死無議諡喪禍之家人莫就食殯葬之後復常無諱諸有送死以為不潔咸於郭外浴而後入至於年耆壽耄死期將至嬰纍沉痾生崖恐極猒離塵俗願棄人間輕鄙生死希逺世路於是親故知友奏樂餞㑹泛舟鼓棹濟殑伽河中流自溺謂得生天十有其一未盡鄙見出家僧衆制無號哭父母亡喪誦念酬恩追逺慎終實資冥福政教既寬機務亦簡戶不藉書人無徭課王田之內大分為四一充國用祭祀粢盛二以封建輔佐宰臣三賞聰睿碩學髙才四樹福田給諸異道所以賦斂輕薄徭稅儉省各安世業俱佃口分假種王田六稅其一商賈逐利來往貿遷津路關防輕稅後過國家營建不虗勞役據其成功酬之價直鎮戍征行宫廬宿衛量事招募懸償待入宰牧輔臣庶官僚佐各有分地自食封邑風壤既别地利亦殊花草果木雜種異名所謂菴沒羅果菴弭羅果未杜迦果跋達羅果劫比他果阿末羅果鎮杜迦果烏曇跋羅果茂遮果那利葪羅果般橠娑果凡厥此類難以備載見珍人世者略舉言焉至於棗栗椑柿印度無聞梨奈桃杏蒲萄等果迦濕彌羅國已來往往間植石榴甘橘諸國皆樹墾田農務稼穡耕耘播植隨時各從勞逸土宜所出稻麥尤多𬞞菜則有薑芥苽瓠葷陀菜等葱蒜雖少噉食亦希家有食者驅令出郭至於乳酪膏酥沙糖石蜜芥子油諸餅麨常所膳也魚羊麞鹿時薦肴胾牛驢象馬豕犬狐狼師子猴猿凡此毛羣例無味噉噉者鄙恥衆所穢惡屏居郭外希迹人間若其酒醴之差滋味流别蒲萄甘蔗剎帝利飲也麴蘖醇醪吠奢等飲也沙門婆羅門飲蒲萄甘蔗漿非酒醴之謂也雜姓卑族無所流别然其資用之器功質有殊什物之具隨時無闕雖釡鑊斯用而炊甑莫知多器壞土少用赤銅食以一器衆味相調手指斟酌略無匕箸至於病患乃用銅匙若其金銀鍮石白玉火珠風土所産彌復盈積珍竒雜寶異類殊名出自海隅易以求貨然其貨用交遷有無金錢銀錢貝珠小珠印度之境疆界具舉風壤之差大略斯在同條共貫粗陳梗槩異政殊俗據國而叙濫波國周千餘里北背雪山三垂黑嶺國大都城周十餘里自數百年王族絶嗣豪傑力競無大君長近始附屬迦畢試國宜粳稻多甘蔗林樹雖衆果實乃少氣序漸溫微霜無雪國俗豐樂人尚歌詠志性怯弱情懷詭詐更相欺誚未有推先體貌卑小動止輕躁多衣白㲲所服鮮飾伽藍十餘所僧徒寡少並多習學大乘法教天祠數十異道甚多從此東南行百餘里踰大嶺濟大河至那揭羅曷國北印度境那揭羅曷國東西六百餘里南北二百五六十里山周四境懸隔危險國大都城二十餘里無大君長主令役屬迦畢試國豐榖稼多花果氣序溫暑風俗淳質猛鋭驍雄輕財好學崇敬佛法少信異道伽藍雖多僧徒寡少諸窣堵波荒蕪圯壞天祠五所異道百餘人城東三里有窣堵波髙三百餘尺無憂王之所建也編石特起刻雕竒製釋迦菩薩值然燈佛敷鹿皮衣布髮掩埿得受記處時經劫壞斯迹無泯或有齊日天雨衆花羣黎心競或修供養其西伽藍少有僧徒次南小窣堵波是昔掩埿之地無憂王避大路遂僻建焉城內有大窣堵波故基聞諸先志曰昔有佛齒髙曠嚴麗今既無齒唯餘故基其側有窣堵波髙三十餘尺彼俗相傳不知源起云從空下峙基於此既非人工實為靈瑞城西南十餘里有窣堵波是如來在日中印度陵虛遊化降迹於此國人感慕建此靈基其東不逺有窣堵波是釋迦菩薩昔值然燈佛於此買花城西南二十餘里至小石嶺有伽藍髙堂重閣積石所成庭宇寂寥絶無僧侣中有窣堵波髙二百餘尺無憂王之所建也伽藍西南深澗峭絶瀑布飛流懸崖壁立東岸石壁有大洞穴瞿波羅龍之所居也門徑狹小窟穴冥暗崖石津滴磎徑餘流昔有佛影煥若真容相好具足儼然如在近代已來人不遍覩縱有所見髣佛而已至誠祈請有冥感者乃暫明視尚不能久昔如來在世之時此龍為牧牛之士供王乳酪進奉失宜既獲譴責心懷恚恨以金錢買花供養受記窣堵波願為惡龍破國害王即趣石壁投身而死遂居此窟為大龍王便欲出穴成本惡願適起此心如來已鑒愍此國人為龍所害運神通力自中印度至龍所龍見如來毒心遂止受不殺戒願護正法因請如來常居此窟諸聖弟子恆受我供如來告曰吾將寂滅為汝留影遣五羅漢常受汝供正法隱沒其事無替汝若毒心奮怒當觀吾留影以慈善故毒心當止此賢劫中當來世尊亦悲愍汝皆留影像影窟門外有二方石其一石上有如來足蹈之跡輪相微現光明時燭影窟左右多諸石室皆是如來諸聖弟子入定之處影窟西北隅有窣堵波有如來經行之處其側窣堵波有如來髮爪鄰此不逺有窣堵波是如來顯暢真宗說藴界之處所也影窟西有大盤石如來嘗於其上濯浣袈裟文影微現城東南三十餘里至醯羅城周四五里竪峻嶮固花林池沼光鮮澄鏡城中居人淳質正信復有重閣畫棟丹楹第二閣中有七寶小窣堵波置如來頂骨骨周一尺二寸髮孔分明其色黃白盛以寶函置窣堵波中欲知善惡相者香末和埿以印頂骨隨其福感其文煥然又有七寶小窣堵波以貯如來髑髏骨狀若荷葉色同頂骨亦以寶函緘絡而置又有七寶小窣堵波貯如來眼睛睛大如奈光明清徹皎映中外又以七寶函緘封而置如來僧伽胝袈裟細㲲所作其色黃赤置寶函中嵗月既逺微有損壞如來錫杖白鐵作鐶栴檀為笴寶筒盛之近有國王聞此諸物並是如來昔親服用恃其威力迫愶而歸既至本國置所居宫中曽未浹辰求之已失爰更尋訪已還本處斯五聖迹多有靈異迦畢試王令五淨行給侍香花觀禮之徒相繼不絶諸淨行等欲從虛寂以為財用人之所重權立科條以止喧雜其大略曰諸欲見如來頂骨者稅一金錢若取印者稅五金錢自餘節級以次科條科條雖重觀禮彌衆重閣西北有窣堵波不甚髙大而多靈怪人以指觸便即搖震連基傾動鈴鐸和鳴從此東南山谷中行五百餘里至健䭾邏國舊曰乾陀衛訛也北印度境健䭾邏國東西千餘里南北八百餘里東臨信河國大都城號布路沙布邏周四十餘里王族絶嗣役屬迦畢試國邑里空荒居人稀少宫城一隅有千餘户榖稼殷盛花果繁茂多甘蔗出石蜜氣序溫暑略無霜雪人性恇怯好習典藝多敬異道少信正法自古已來印度之境作論諸師則不那羅延天無著菩薩世親菩薩法救如意脅尊者等本生處也僧伽藍千餘所摧殘荒廢蕪蔓蕭條諸窣堵波頗多頽圯天祠百數異道雜居王城內東北有一故基昔佛鉢之寶臺也如來涅槃之後鉢流此國經數百年式遵供養流傳諸國在波刺斯城外東南八九里有卑鉢羅樹髙百餘尺枝葉扶踈䕃影䝉密過去四佛已坐其下今猶現有四佛坐像賢劫之中九百九十六佛皆當坐焉冥祗警衛靈鑒潜被釋迦如來於此樹下南面而坐告阿難曰我去世後當四百年有王命世號迦膩色迦此南不逺起窣堵波吾身所有骨肉舍利多集此中卑鉢羅樹南有窣堵波迦膩色迦王之所建也迦膩色迦王以如來涅槃之後第四百年君臨膺運統贍部洲不信罪福輕毁佛法畋遊草澤遇見白兔王親奔逐至此忽滅見有牧牛小豎於林樹間作小窣堵波其髙三尺王曰汝何所為牧豎對曰昔釋迦佛聖智懸記當有國王於此勝地建窣堵波吾身舍利多聚其內大王聖德宿殖名符昔記神功勝福允屬斯辰故我今者先相警發說此語已忽然不現王聞是說喜慶增懷自負其名大聖先記因發正信深敬佛法周小窣堵波處建石窣堵波欲以功力彌覆其上隨其數量恆出三尺若是增髙踰四百尺基址所峙周一里半層基五級髙一百五十尺方乃得覆小窣堵波王用喜慶復於其上更起二十五層金銅相輪即以如來舍利一斛而置其中式修供養營建才訖見小窣堵波在大基東南隅下傍出其半王心不平便即擲棄遂住窣堵波第二級下石基中半現復於本處更出小窣堵波王乃退而歎曰嗟夫人事易迷神功難掩靈聖所扶憤怒何及慙懼既已謝咎而歸其二窣堵波今猶現在有嬰疾病欲祈康愈者塗香散花至誠歸命多䝉瘳差大窣堵波東面石陛南鏤作二窣堵波一髙三尺一髙五尺規模形狀如大窣堵波又作兩軀佛像一髙四尺一髙六尺擬菩提樹下跏趺坐像日光照燭金色晃耀隂影漸移石丈青紺聞諸耆舊曰數百年前石基之隙有金色蟻大者如指小者如麥同類相從齧其石壁文若雕鏤厠以金沙作為此像今猶現在大窣堵波石陛南靣有畫佛像髙一丈六尺自胸已上分現兩身從胸已下合為一體聞諸先志曰初有貧士傭力自濟得一金錢願造佛像至窣堵波所謂畫工曰我今欲圖如來妙相有一金錢酬工尚少宿心憂負迫於貧乏時彼畫工鑒其至誠無云價直許為成功復有一人事同前迹持一金錢求畫佛像畫工是時受二人錢求妙丹青共畫一像二人同日俱來禮敬畫工乃同指一像示彼二人而謂之曰此是汝所作之佛像也二人相視若有所懷畫工心知其疑也請二人曰何思慮之久乎凡所受物毫釐不虧斯言不謬像必神變言聲未靜像現靈異分身交影光相昭著二人恱服心信歡喜大窣堵波西南百餘步有白石佛像髙一丈八尺北面而立多有靈相數放光明時有人見像出夜行旋繞大窣堵波近有羣賊欲入行盜像遂出迎賊賊黨怖退像歸本處住立如故羣盜因此改過自新遊行邑里具告逺近大窣堵波左右小窣堵波魚鱗百數佛像莊嚴務窮工思殊香異音時有聞聽靈仙聖賢或見旋繞此窣堵波者如來懸記七燒七立佛法方盡先賢記曰成壞已三初至此國適遭火災當見營搆尚未成功大窣堵波西有故伽藍迦膩色迦王之所建也重閣纍榭層臺洞户旌召髙僧式昭景福然雖圯毁尚曰竒工僧徒減少並學小乘自建伽藍異人間出諸作論師及證聖果清風尚扇至德無泯第三重閣有波栗濕縳唐言脅尊者室久已傾頓尚立旌表初尊者之為梵志師也年垂八十捨家染衣城中少年便誚之曰愚夫朽老一何淺智夫出家者有二業焉一則習定二乃誦經而今衰耄無所進取濫迹清流徒知飽食時脅尊者聞諸譏議因謝時人而自誓曰我若不通三藏理不斷三界欲得六神通具八解脫終不以脅而至於席自爾之後唯日不足經行宴坐住立思惟晝則研習理教夜乃靜慮凝神綿歷三嵗學通三藏斷三界欲得三明智時人敬仰因號脅尊者焉脅尊者室東有故房世親菩薩於此製阿毗達磨俱舍論人而敬之封以記焉世親室南五十餘步第二重閣末笯曷利他唐言如意論師於此製毗婆沙論論師以佛涅槃之後一千年中利見也少好學有才辨聲聞遐被去俗歸心時室邏代悉底國毗訖羅摩阿迭多王唐言超日威風逺洽使臣諸印度日以五億金錢周給貧窶孤獨主藏臣懼國用之匱也乃諷諫曰大王威被殊俗澤及昆蟲請增五億金錢以賑四方匱乏府庫既空更稅有土重斂不已怨聲載揚則君上有周給之恩臣下被不恭之責王曰聚有餘給不足非茍為身侈靡國用遂加五億惠諸貧乏其後畋遊逐豕失蹤有尋知迹者償一億金錢如意論師一使人剃髮輒賜一億金錢其國史臣依即書記王恥見髙心常怏怏欲罪辱如意論師乃招集異學德業髙深者百人而下令曰欲收視聽遊諸真境異道紛雜歸心靡措今考優劣專精遵奉洎乎集論重下令曰外道論師並英俊也沙門法衆宜善宗義勝則崇敬佛法負則誅戮僧徒於是如意詰諸外道九十九人已退飛矣下席一人視之蔑如也因而劇談論及火烟王與外道咸喧言曰如意論師辭義有失夫先煙而後及火此事理之常也如意雖欲釋難無聽鑒者恥見衆辱齰斷其舌乃書誡告門人世親曰黨援之衆無競大義羣迷之中無辨正論言畢而死居未久超日王失國興王膺運表式英賢世親菩薩欲雪前恥來白王曰大王以聖德君臨為含識主命先師如意學窮𤣥奧前王宿憾衆挫髙名我承導誘欲復先怨其王知如意哲人也美世親雅操焉乃召諸外道與如意論者世親重述先㫖外道謝屈而退迦膩色迦王伽藍東北行五十餘里渡大河至布色羯邏伐底城周十四五里居人殷盛閭閻洞連城西門外有一天祠天像威嚴靈異相繼城東有窣堵波無憂王之所建也即過去四佛說法之處先古聖賢自中印度降神導物斯地實多即代蘇蜜呾羅唐言世友舊曰和須蜜多訛也論師於此製衆事分阿毗達磨論城北四五里有故伽藍庭宇荒涼僧徒寡少然皆遵習小乘法教即達磨呾邏多唐言法救舊曰達磨多羅訛也論師此製襟阿毗達磨論伽藍側有窣堵波髙數百尺無憂王之所建也雕木文石頗異人工是釋迦佛昔為國王修菩薩行從衆生欲惠施不倦喪身若遺於此國土千生為王即斯勝地千生捨眼捨眼東不逺有二石窣堵波各髙百餘尺右則梵王所立左乃天帝所建以妙珍寶而瑩飾之如來寂滅寶變為石基雖傾陷尚曰崇髙梵釋窣堵波西北行五十餘里有窣堵波是釋迦如來於此化鬼子母令不害人故此國俗祭以求嗣化鬼子母北行五十餘里有窣堵波是商莫迦菩薩舊曰睒摩菩薩訛也恭行鞠養侍育父母於此採果遇王畋遊獵毒矢誤中至誠感靈天帝傅藥德動明聖尋即復蘇商莫迦菩薩被害東南行二百餘里至跋虜沙城城北有窣堵波是蘇達拏太子唐言善牙以父王大象施婆羅門䝉譴被擯顧謝國人既出郭門於此告别其側伽藍五十餘僧並小乘學也昔伊濕伐邏唐言自在論師於此製阿毗達磨明證論跋虜沙城東門外有一伽藍僧徒五十餘人並大乘學也有窣堵波無憂之所建立也昔蘇達拏太子擯在彈多落迦山舊曰擅特山訛之也婆羅門乞其男女於此鬻賣跋虜沙城東北二十餘里至彈多落迦山嶺上有窣堵波無憂王所建蘇達拏太子於此棲隱其側不逺有窣堵波太子於此以男女施婆羅門婆羅門捶其男女流血染地今諸草木猶帶絳色巖間石室太子及妃習定之處谷中林樹垂條若帷並是太子昔所遊止其側不逺有一石廬即古仙人之所居也仙廬西北行百餘里越一小山至大山山南有伽藍僧徒鮮少並學大乘其側窣堵波無憂王之所建也昔獨角仙人所居之處仙人為淫女誘亂退失神通淫女乃駕其肩而還城邑跋虜沙城東北五十餘里至崇山山有青石大自在天婦像毗摩天女也聞諸士俗曰此天像者自然有也靈異既多祈禱亦衆印度諸國求福請願貴賤畢萃逺近咸㑹其有願見天神形者至誠無二絶食七日或有得見求願多遂山下有大自在天祠塗灰外道式修祠祀毗摩羅天祠東南行百五十里至烏鐸迦漢茶城周二十餘里南臨信度河居人富樂寶貨盈積諸方珍多集於此烏鐸迦漢茶城西北行二十餘里至婆羅覩邏邑是製聲明論波你尼仙本生處也遂古之初文字繁廣時經劫壞世界空虛長壽諸天降靈導俗由是之故文籍生焉自時厥後其源泛濫梵王天帝作則隨時異道諸仙各製文字人相祖述競習所傳學者虛功難用詳䆒人壽百嵗之時有波你尼仙生知博物愍時澆薄欲削浮僞刪定繁猥遊方問道遇自在天遂伸述作之志自在天曰盛矣哉吾當祐汝仙人受教而退於是研精覃思捃托羣言作為字書備有千頌頌三十二言矣䆒極今古揔括文言封以進上王甚珍異下令國中普使傳習有誦通利賞千金錢所以師資傳授盛行當世故此邑中諸婆羅門碩學髙才博物強識婆羅覩邏邑中有窣堵波羅漢化波你尼仙後進之處如來去世垂五百年有大阿羅漢自迦濕彌羅國遊化至此乃見梵志捶訓稚童時阿羅漢謂梵志曰何苦此兒梵志曰令學聲明業不時進阿羅漢逌爾而笑老梵志曰夫沙門者慈悲為情愍傷物類仁今所笑願聞其說阿羅漢曰談不容易恐致深疑汝頗嘗聞波你尼仙製聲明論垂訓於世乎婆羅門曰此邑之子後進仰德像設猶存阿羅漢曰今汝此子即是彼仙猶以強識玩習世典唯談異論不䆒真理神智唐捐流轉未息尚乘餘善為汝愛子然則世典文辭徒疲功績豈若如來聖教福智冥滋曩者南海之濵有一枯樹五百蝙蝠於中穴居有諸商侣止此樹下時屬風寒人皆饑凍聚積樵蘇藴火其下煙熖漸熾枯樹遂然時商侣中有一賈客夜分已後誦阿毗達磨藏彼諸蝙蝠雖為火困愛好法音忍而不出於此命終隨業受生俱得人身捨家修學乘聞法聲聰明利智並證聖果為世福田近迦膩色迦王與脅尊者招集五百賢聖於迦濕彌羅國作毗婆沙論斯並枯樹之中五百蝙蝠也余雖不肖是其一數斯則優劣良異飛伏懸殊仁今愛子可許出家出家功德言不能述時阿羅漢說此語已示神通事因忽不現婆羅門深生敬信歎羡久之具告鄰里遂放其子出家修學因即回信崇重三寶鄉人從化於今弥篤從烏鐸迦漢荼城北踰山涉川行六百餘里至烏仗那國唐言苑昔輪王之苑囿也舊曰烏孫埸或曰烏茶皆訛北印度境也音釋疇壠上直流反下吕勇反田疇也山壠也邊裔下音曳邊末之地融余弓反和也閭閻上力居反閭里也廣峙下直里反基也闤闠上音還下音㑹闤闠市門也斥音尺弃不用也編必綿反編織也苫茅上失兼反苫茅覆屋草也榱梠上音衰下音吕屋端木也侈昌爾反華侈也隩室音奧屋西南隅門闢下毗益反開也服玩下愚貫反襜衣上昌檢反芻摩上初住反諸經多作芻摩此云麻衣顩鉢上丘嚴反或作欽婆羅褐剌縭上胡葛反中郎達反下敕知反又作緇側思反野獸毛也緝績上七入反褊衣必展反窄也椎髻上直追反帶襻下匹慢反為褶下音輒襇褶也絛土高反徒跣下先典反赤足步行矯居小反妄也盥洗上音貫澡潄早瘦二音溲溺上音搜下尿字小遺也澡濯下音濁洗也核胡革反拘縶下知立反繫也羇旅上居宜反寄客居也巡丐下音蓋乞兒也醇醨上音純下音離濃薄謂也赭堊上音者下音惡罹咎上音離遭也貿莫候反易也篡弒上初患反奪也下音試殺也捍胡旦反抵也矛盾上莫浮反下時尹反鉞斧上音越下音甫戈殳上古和反戈㦸也下音殊字矟音朔槍矟囹圄二字音令語獄名也劓鼻上魚器反割鼻刑也刖足上吾骨反斷足刑也愞弱上奴卧反髀蒲米反腿髀也摩踵下之勇反足跟也拊音甫拍也瘳差上音抽下瘥字餌藥上音二服藥也飼獸上音寺餧飼也殂落上在吾反死也議諡下音示以封後號也諱許謂反忌也耄音帽老耄也餞㑹上音賤酒食相送也粢盛上音咨祭食也風壤下汝兩反土也葪音計墾田音懇字耕田也葷陀上兄云反肴胾上户交反乾肉也下側事反肉臠也醇醪音純勞酒異名也壞土上匹回反瓦壞匕箸上音比匙也下音佇與筯同梗槩上加猛反下古愛反梗槩大略也斯誚下才笑反責也圯壞上音比毁也磎徑上音兮譴責上起現反笴古罕反箭笴也迫愶下許業反以威逼人頺圮上徒回反頽墜也規摹上音圭下模同齧魚列反咬齧也阿迭下徒結反詰起一反論難也蔑如上莫結反無也齰斷上助陌反齧齰也黨援下音院朋黨也援助也睒式染反跋虜上蒲末反下音魯鬻上音育亦賣也捶之委反打也鮮少上息淺反萃才遂反集也削思約反捃托上居運反下音隻捃托採拾也稚童上直利反幼稚逌爾上音由深視貌蝙蝠邉福二音不肖音笑謂不似也苑囿上音逺下音右大唐西域記卷二
